<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <title>Polemico | Menú</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="hero">
      <img id="logo" class="logo" src="logo.png" alt="Polemico" onerror="this.style.display='none'">
      <p class="eyebrow">AHUMADO · CERDO · SABOR</p>
      <h1>MENÚ</h1>
      <p class="intro">Conoce nuestros platos y pide directo por WhatsApp.</p>
    </header>

    <section id="menu-container" class="menu-container" aria-label="Menú"></section>

    <section class="actions">
      <a id="whatsapp-btn" class="btn btn-primary" target="_blank" rel="noopener noreferrer">
        Pedir por WhatsApp
      </a>
      <a id="instagram-btn" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">
        Ver Instagram
      </a>
    </section>

    <footer>
      <p>Polemico</p>
    </footer>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
